<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#862b32"><link rel="apple-touch-icon" href="icon.png"><title>Moeller 2026 • Shopping companion</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f3ed;color:#222;font:16px system-ui,sans-serif}header{background:#862b32;color:white;padding:18px}h1{font-size:25px;margin:0}small{font-size:13px}main{max-width:850px;margin:auto;padding:12px}section,article{background:white;border:1px solid #dedbd3;border-radius:12px;padding:14px;margin-bottom:10px}input,select,button,textarea{font:inherit;padding:10px;border:1px solid #bbb;border-radius:8px;min-width:0;background:white;color:#222}button{cursor:pointer;font-weight:600}button.primary{background:#862b32;color:white;border:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wide{width:100%}.muted{color:#666;font-size:13px}.money{font-size:23px;font-weight:700}.tag{font-size:12px;background:#eee;padding:3px 7px;border-radius:5px;display:inline-block;margin:3px 3px 3px 0}.warn{color:#922d22;font-size:13px}h2{font-size:18px;margin:4px 0}p{margin:8px 0}label{display:block;font-size:13px;color:#555}details{margin-top:10px}summary{cursor:pointer;color:#862b32;font-weight:600}a{color:#862b32}progress{width:100%;accent-color:#862b32}article.bought{border-left:5px solid #39734e}textarea{width:100%}</style><header><h1>Moeller 2026 · V2 TEST</h1><small>Saturday, November 28 · Raw cards only</small></header><main><section><label>Import private inventory (JSON)<input class="wide" type="file" accept=".json,application/json" onchange="importInventory(this)"></label><p id="inventoryStatus" class="muted"></p><p class="muted">Import locally; no inventory is uploaded. Back up purchases regularly.</p></section><section><div class="grid"><div><label>Show budget ($)</label><input id="budget" type="number" min="0" class="wide"></div><div><label>Remaining</label><div id="remaining" class="money"></div></div></div><progress id="progress" max="100"></progress><p id="totals"></p><div id="storage" class="warn"></div><div class="grid"><button onclick="exportCSV()">Export purchases CSV</button><button onclick="backup()">Save session backup</button></div><label>Restore session backup <input type="file" accept=".json" onchange="restore(this)"></label></section><section><input id="q" class="wide" placeholder="Search player, year, set, #, sponsor" type="search"><div class="grid" style="margin-top:8px"><select id="group"><option value="all">All targets</option><option value="short">Show shortlist</option><option value="odd">Regional & oddballs</option><option value="upgrade">All condition upgrades</option><option value="1975">1975 Topps upgrades</option><option value="review">Purchase review</option><option value="unknown">No reliable price</option></select><select id="player"><option value="all">All players</option></select><select id="status"><option value="open">Not purchased</option><option value="all">All statuses</option><option value="bought">Purchased</option><option value="seen">Dealer leads</option></select><select id="sort"><option value="original">Inventory order</option><option value="low">Guide price: low first</option><option value="high">Guide price: high first</option><option value="year">Year</option></select></div><label style="margin-top:8px">Shop by Set<select id="setFilter" class="wide"><option value="all">All sets</option></select></label><p class="muted">Guide prices are mixed-condition raw estimates, not ceilings. Blank means unavailable. Source links require internet.</p><b id="count"></b></section><div id="cards"></div><button id="more" class="wide" onclick="limit+=50;render()">Show more</button></main><script>let data=[];const K='Physical identity key';let state={budget:750,items:{}};let persistent=true;try{let x=localStorage.getItem('moeller2026_test_v2');if(x)state=JSON.parse(x);localStorage.setItem('moeller2026_test_v2',JSON.stringify(state))}catch(e){persistent=false}const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const cash=x=>x!==''&&x!=null&&Number.isFinite(Number(x))?'$'+Number(x).toFixed(2):'—';const guide=r=>r['SportsCardsPro ungraded market value']||r['Supplementary raw market value'];const upgrade=r=>/upgrade/i.test(r['Shopping disposition']||'')||r['Inventory status']==='Upgrade wanted'||r.Worksheet==='Cincinnati Show List';const players=r=>(r['Player or players']||r['Player / Card']||'').split(/\s+\/\s+/).map(x=>x.trim()).filter(Boolean);const setName=r=>[r.Year,r.Manufacturer,r.Set].filter(Boolean).join(' · ');const sets=r=>[setName(r),...(r.phase37d_set_ids||'').split(/\s*\|\s*|\s*;\s*/).filter(Boolean).map(x=>x.replace(/-/g,' '))];let limit=50;function save(){try{localStorage.setItem('moeller2026_test_v2',JSON.stringify(state))}catch(e){persistent=false}totals()}function totals(){let a=Object.values(state.items).filter(x=>x.bought),spent=a.reduce((s,x)=>s+(Number(x.paid)||0),0);$('remaining').textContent=cash(state.budget-spent);$('totals').textContent=a.length+' purchased · '+cash(spent)+' spent · '+a.filter(x=>x.paid===''||x.paid==null).length+' missing paid price';$('progress').value=state.budget?spent/state.budget*100:0;$('storage').textContent=persistent?'Saved locally when supported. Export a backup regularly.':'Local storage unavailable. Keep this page open and export backups.'}function edit(i,k,val){let key=data[i][K];state.items[key]??={};state.items[key][k]=val;save()}function buy(i){let key=data[i][K];state.items[key]??={};state.items[key].bought=!state.items[key].bought;save();render()}function field(i,k,label,type='text'){let s=state.items[data[i][K]]||{};return `<label>${label}<input class="wide" type="${type}" ${type==='number'?'min="0" step="0.01"':''} value="${esc(s[k]??'')}" onchange="edit(${i},'${k}',this.value)"></label>`}function link(u,label){return /^https?:\/\//i.test(u||'')?`<a href="${esc(u)}" target="_blank" rel="noopener">${label}</a>`:''}function render(){let q=$('q').value.toLowerCase().trim().split(/\s+/),g=$('group').value,p=$('player').value,s=$('status').value;let a=data.map((r,i)=>({r,i})).filter(({r})=>{let t=state.items[r[K]]||{},hay=[r.Worksheet,r['Player / Card'],r.Year,r.Manufacturer,r.Set,r['Card number'],r['Variation / Details'],r['Physical variation'],r['Secondary tags'],r['Player or players'],...sets(r)].join(' ').toLowerCase();return q.every(x=>hay.includes(x.replace(/^#/,'')))&&(p==='all'||players(r).includes(p))&&($('setFilter').value==='all'||sets(r).includes($('setFilter').value))&&(g==='all'||g==='short'&&r.Shortlist==='Yes'||g==='odd'&&r['Oddball target']==='Yes'||g==='upgrade'&&upgrade(r)||g==='1975'&&upgrade(r)&&r.Year==='1975'&&r.Manufacturer==='Topps'||g==='review'&&r['Purchase-review flag']||g==='unknown'&&r['Pricing confidence']==='Unavailable')&&(s==='all'||s==='open'&&!t.bought||s==='bought'&&t.bought||s==='seen'&&!t.bought&&(t.dealer||t.ask||t.notes))});let sort=$('sort').value;if(sort==='year')a.sort((a,b)=>a.r.Year.localeCompare(b.r.Year));if(sort==='low'||sort==='high')a.sort((a,b)=>!guide(a.r)&&!guide(b.r)?0:!guide(a.r)?1:!guide(b.r)?-1:(Number(guide(a.r))-Number(guide(b.r)))*(sort==='low'?1:-1));$('count').textContent=a.length+' matching cards';$('more').hidden=a.length<=limit;$('cards').innerHTML=a.slice(0,limit).map(({r,i})=>{let t=state.items[r[K]]||{};let bands=['EX','EX-MT','NM','NM-MT','MT'].filter(b=>r[b+' low']).map(b=>`${b}: ${cash(r[b+' low'])}–${cash(r[b+' high'])}`).join(' · ');return `<article class="${t.bought?'bought':''}"><div class="muted">${esc(r.Year)} · ${esc(r.Manufacturer)} · ${esc(r.Set)} · #${esc(r['Card number'])}</div><h2>${esc(r['Player / Card'])}</h2><p>${esc(r['Variation / Details'])}</p><span class="tag">${esc(r['Pricing confidence'])} confidence</span>${r['Oddball target']?' <span class="tag">Oddball</span>':''}${upgrade(r)?' <span class="tag">Upgrade</span>':''}${r.Shortlist?' <span class="tag">Shortlist</span>':''}<div class="grid"><div><label>Raw guide</label><b>${guide(r)?cash(guide(r)):'Unpriced'}</b></div><div><label>Sold median (${esc(r['Comparable sale count']||'0')} comps)</label><b>${cash(r['Median raw sold price'])}</b></div><div><label>Supported ceiling</label><b>${cash(r['Recommended purchase ceiling'])}</b></div><div><label>Fair range</label><b>${cash(r['Fair purchase price — low'])}–${cash(r['Fair purchase price — high'])}</b></div></div>${r['Unresolved identity flag']?`<p class="warn">${esc(r['Unresolved identity flag'])}</p>`:''}${bands?`<p class="muted">Seller-described condition: ${esc(bands)}</p>`:''}<details><summary>Pricing evidence & card details</summary><p>${esc(r['Physical variation'])}</p><p class="muted">${esc(r['Purchase-review flag'])}</p><p>${esc(r['Pricing notes'])}</p><p>${esc(r['Comparable sales date range'])} ${esc(r['Comparable shipping treatment'])}</p><p>${link(r['SportsCardsPro URL'],'Price source')} · ${link(r['Workbook link'],'Workbook row')}</p></details><details ${t.bought?'open':''}><summary>Dealer / purchase record</summary><div class="grid">${field(i,'ask','Asking ($)','number')}${field(i,'paid','Paid ($)','number')}${field(i,'dealer','Dealer / table')}${field(i,'condition','New condition')}${upgrade(r)?field(i,'previous','Previous condition'):''}</div><label>Notes<textarea onchange="edit(${i},'notes',this.value)">${esc(t.notes||'')}</textarea></label></details><button class="primary wide" onclick="buy(${i})">${t.bought?'Undo purchased':'Mark purchased'}</button></article>`}).join('')}
function download(name,content,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function backup(){download('Moeller-session.json',JSON.stringify(state),'application/json')}async function restore(el){try{let x=JSON.parse(await el.files[0].text());if(!x.items||!Number.isFinite(Number(x.budget)))throw Error();if(confirm('Replace current session with backup?')){state=x;$('budget').value=state.budget;save();render()}}catch(e){alert('Invalid backup')}}function exportCSV(){let cols=[K,'Worksheet','Row','Year','Manufacturer','Set','Card number','Player / Card','Variation / Details','Inventory status'];let keys=['bought','ask','paid','dealer','previous','condition','notes'];let quote=x=>'"'+String(x??'').replace(/"/g,'""')+'"';let rows=[cols.concat(keys)];data.forEach(r=>{let t=state.items[r[K]];if(t&&Object.values(t).some(Boolean))rows.push(cols.map(k=>r[k]).concat(keys.map(k=>t[k]??'')))});download('Moeller-purchase-log.csv','\ufeff'+rows.map(r=>r.map(quote).join(',')).join('\r\n'),'text/csv')}$('budget').value=state.budget;$('budget').onchange=()=>{state.budget=Math.max(0,Number($('budget').value)||0);save()};function loadPlayers(){ $('player').replaceChildren(new Option('All players','all')); [...new Set(data.flatMap(players))].sort().forEach(p=>$('player').add(new Option(p,p))); $('setFilter').replaceChildren(new Option('All sets','all'));[...new Set(data.flatMap(sets))].sort().forEach(v=>$('setFilter').add(new Option(v,v))); $('inventoryStatus').textContent=data.length+' cards loaded'; } async function importInventory(el){try{let x=JSON.parse(await el.files[0].text());if(!Array.isArray(x)||!x.length||x.some(r=>!r[K]||typeof r.Worksheet!=='string'||typeof r.Year!=='string')||new Set(x.map(r=>r[K])).size!==x.length)throw Error('Invalid inventory');localStorage.setItem('moellerInventory_test_v2',JSON.stringify(x));data=x;loadPlayers();render()}catch(e){alert('Import failed: '+e.message)}} try{data=JSON.parse(localStorage.getItem('moellerInventory_test_v2')||'[]')}catch(e){} loadPlayers(); if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(e=>console.warn(e));['q','group','player','status','sort','setFilter'].forEach(k=>$(k).oninput=()=>{limit=50;render()});totals();render();</script></html>
